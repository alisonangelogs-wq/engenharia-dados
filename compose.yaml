services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: engenharia_dados
      POSTGRES_USER: engenharia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engenharia -d engenharia_dados"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
